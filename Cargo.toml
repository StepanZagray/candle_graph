[package]
name = "candle-graph"
version = "0.9.0"
edition = "2021"
description = "TensorFlow Profiler-style execution graphs for candle-rs (trace-only)"
readme = "README.md"
license = "MIT"
authors = ["Stepan Zagray"]
keywords = ["candle", "machine-learning", "profiler", "deep-learning"]
categories = ["development-tools", "science"]
repository = "https://github.com/StepanZagray/candle_graph"
documentation = "https://docs.rs/candle-graph"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/CONTEXT.md",
    "/docs/features.md",
    "/docs/runtime-analysis-guide.md",
    "/docs/visualizer.md",
    "/src/**",
    "/tests/**",
    "/benches/**",
]

[features]
default = ["visualizer"]
visualizer = []
candle = ["dep:candle-core"]
all = ["visualizer", "candle"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
candle-core = { version = "0.11", default-features = false, optional = true }

[lib]
name = "candle_graph"
path = "src/lib.rs"

[[bin]]
name = "candle-graph"
path = "src/main.rs"

[[bin]]
name = "cargo-candle-graph"
path = "src/cargo_candle_graph.rs"

[[test]]
name = "trace_viewer"
required-features = ["visualizer"]

[[bench]]
name = "instrumentation_overhead"
harness = false
