[package]
name = "candle-graph"
version = "0.2.0"
edition = "2021"
description = "Static structure and dataflow analysis for candle-rs models"
readme = "README.md"
license = "MIT"
authors = ["Stepan Zagray"]
keywords = ["candle", "machine-learning", "static-analysis", "deep-learning"]
categories = ["development-tools", "science"]
repository = "https://github.com/StepanZagray/candle_graph"
documentation = "https://docs.rs/candle-graph"
exclude = ["/target/**", "/.git/**"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit", "parsing", "printing"] }
quote = "1"
walkdir = "2"

[lib]
name = "candle_graph"
path = "src/lib.rs"

[[bin]]
name = "candle-graph"
path = "src/main.rs"

[[bin]]
name = "cargo-candle-graph"
path = "src/cargo_candle_graph.rs"
